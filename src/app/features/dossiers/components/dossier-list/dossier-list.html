<h2>Liste des dossiers</h2>

<p-table [value]="dossiers()" [loading]="loading()" [tableStyle]="{'min-width' : '60rem'}">

    <ng-template #header>
        <tr>
            <th>Numéro</th>
            <th>Titre</th>
            <th>Statut</th>
            <th>Date de création</th>
            <th>Date de Modification</th>
            <th>Date de clôture</th>
        </tr>
    </ng-template>
    <ng-template #body let-dossier>
        <tr>
            <td>{{dossier.numero}}</td>
            <td>{{dossier.titre}}</td>
            <td>{{dossier.statut}}</td>
            <td>{{dossier.dateCreation}}</td>
            <td>{{dossier.dateModification}}</td>
            <td>{{dossier.dateCloture}}</td>
               <!--On ajoute le bouton voir-->
               <td>
                 <p-button
                 label="voir"
                 icon="pi pi-eye"
                 [routerLink]="['/dossiers', dossier.id]"></p-button>
               </td>
        </tr>
 
      

    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="4"> Aucun dossier trouvé.</td>
        </tr>
    </ng-template>


</p-table>
